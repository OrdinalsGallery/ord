<!doctype html>
<html lang=en>
  <head>
    <meta charset=utf-8>
    <meta name=viewport content='width=device-width,initial-scale=1.0'>
    <title>{{ self.title }}</title>
    <style>
      html, body { height: 100%; margin: 0; background: #131516; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      video { max-width: 100%; max-height: calc(100% - 28px); }
      a.embed-attribution {
        color: #ccc; font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-decoration: none; padding: 6px 0;
      }
      a.embed-attribution:hover { color: #fff; }
    </style>
  </head>
  <body>
    <video controls preload=metadata>
      <source src=/content/{{self.inscription_id}}>
    </video>
    <a class=embed-attribution href=/inscription/{{self.inscription_id}} target=_blank rel=noopener>View on Ordinals</a>
  </body>
</html>
