<!doctype html>
<html lang=en>
  <head>
    <meta charset=utf-8>
    <meta name=viewport content='width=device-width,initial-scale=1.0'>
    <title>{{ self.title }}</title>
    <style>
      html, body { height: 100%; margin: 0; background: #131516; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      a.embed-attribution {
        color: #ccc; font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-decoration: none; padding: 6px 0;
      }
      a.embed-attribution:hover { color: #fff; }
      img {
        max-width: 100%; max-height: calc(100% - 28px);
        image-rendering: {{ self.image_rendering }};
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <img src=/content/{{self.inscription_id}} alt='inscription {{self.inscription_id}}'>
    <a class=embed-attribution href=/inscription/{{self.inscription_id}} target=_blank rel=noopener>View on Ordinals</a>
  </body>
</html>
