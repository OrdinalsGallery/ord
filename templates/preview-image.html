<!doctype html>
<html lang=en>
  <head>
    <meta charset=utf-8>
    <meta name=format-detection content='telephone=no'>
    <title>Inscription {{self.inscription_number}} Preview</title>
    <style>
      html {
        /* Transparent so the iframe blends with whatever the embedding
           page's background is — the image is `background-size: contain`,
           and any unfilled space (top/bottom or left/right when the
           inscription isn't square) used to show through as a dark band
           against light-themed parent pages. */
        background-color: transparent;
        height: 100%;
      }

      body {
        background-image: url(/content/{{self.inscription_id}});
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        height: 100%;
        image-rendering: {{ self.image_rendering }};
        margin: 0;
      }

      img {
        float: left;
        height: 100%;
        opacity: 0;
        width: 100%;
      }
    </style>
    <script src=/static/preview-image.js type=module defer></script>
  </head>
  <body>
    <img src=/content/{{self.inscription_id}} alt='inscription {{self.inscription_id}}'>
  </body>
</html>
